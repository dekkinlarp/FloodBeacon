<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Same geometry as BrandMark (src/components/BrandMark.tsx); the ring darkens in light browser chrome. -->
  <style>
    .ring { stroke: #38bdf8; }
    .water { fill: #38bdf8; fill-opacity: 0.55; }
    @media (prefers-color-scheme: light) {
      .ring { stroke: #0369a1; }
      .water { fill-opacity: 1; }
    }
  </style>
  <clipPath id="c"><circle cx="16" cy="16" r="9.5"/></clipPath>
  <rect class="water" x="6" y="17" width="20" height="10" clip-path="url(#c)"/>
  <circle class="ring" cx="16" cy="16" r="12" fill="none" stroke-width="4"/>
</svg>
